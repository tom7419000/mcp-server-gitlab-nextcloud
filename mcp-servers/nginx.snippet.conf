# Beispiel-Konfiguration zum Einfügen in eine bestehende nginx-Config, um
# gitlab-mcp und nextcloud-mcp über den bereits vorhandenen Reverse Proxy
# zu erreichen. Beide Container binden nur an 127.0.0.1 (siehe
# docker-compose.yml), sind also ohne diesen Proxy vom LAN aus nicht
# erreichbar.
#
# Wichtig für den MCP "Streamable HTTP"-Transport: der Endpunkt /mcp
# beantwortet POST-Requests normal, kann für GET aber einen lang lebenden
# SSE-Stream öffnen. Ohne die untenstehenden Einstellungen (insbesondere
# proxy_buffering off und ein hoher proxy_read_timeout) kappt nginx den
# Stream nach dem Default-Timeout von 60s - der MCP-Client sieht dann
# scheinbar zufällige Verbindungsabbrüche.

server {
    # ... bestehende TLS-/Server-Direktiven (listen 443 ssl, server_name,
    # ssl_certificate, ...) hier unverändert lassen ...

    location /gitlab-mcp/ {
        proxy_pass http://127.0.0.1:3001/;

        # Vom Client mitgeschickten Bearer-Token 1:1 durchreichen.
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE/Streamable-HTTP-Tauglichkeit:
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /nextcloud-mcp/ {
        proxy_pass http://127.0.0.1:3002/;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
